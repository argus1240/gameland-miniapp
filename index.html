<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>گیم‌لند</title><link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">
<header class="top">
  <div><span class="eyebrow">دنیای بازی‌های کوچک</span><h1>🎮 گیم‌لند</h1></div>
  <div class="wallet">🪙 <b id="coins">120</b></div>
</header>
<section class="profile card">
  <div class="avatar">👾</div><div class="profile-info"><b id="username">بازیکن گیم‌لند</b><small>سطح <span id="level">1</span> · تجربه <span id="xp">0</span></small><div class="progress"><i id="xpbar"></i></div></div>
</section>
<div class="section-head"><div><h2>بازی‌ها</h2><p>یکی رو انتخاب کن و شروع کن!</p></div><span class="pill">7 بازی</span></div>
<main id="games" class="games">
  <button class="game-card" data-game="tic"><span class="game-icon">⭕</span><b>دوز</b><small>هوش مصنوعی و دونفره</small></button>
  <button class="game-card" data-game="puzzle"><span class="game-icon">🧩</span><b>پازل اعداد</b><small>ذهن خودت رو بسنج</small></button>
  <button class="game-card" data-game="aim"><span class="game-icon">🎯</span><b>هدف‌گیری</b><small>سرعت عمل</small></button>
  <button class="game-card" data-game="car"><span class="game-icon">🏎️</span><b>ماشین‌بازی</b><small>از موانع دوری کن</small></button>
  <button class="game-card" data-game="jump"><span class="game-icon">🐸</span><b>پرش</b><small>امتیاز جمع کن</small></button>
  <button class="game-card" data-game="image"><span class="game-icon">🖼️</span><b>حدس تصویر</b><small>چی می‌بینی؟</small></button>
  <button class="game-card" data-game="football"><span class="game-icon">⚽</span><b>ضربه پنالتی</b><small>گل بزن!</small></button>
</main>
<section class="card stats"><div><b id="wins">0</b><small>بردها</small></div><div><b id="played">0</b><small>بازی‌ها</small></div><div><b id="best">0</b><small>رکورد</small></div></section>
<nav class="bottom"><span class="active">⌂<small>خانه</small></span><span id="profileTab">♙<small>پروفایل</small></span><span id="helpTab">ⓘ<small>راهنما</small></span></nav>
</div>
<div id="modal" class="modal hidden"><div class="dialog"><button class="close" id="close">✕</button><h2 id="gameTitle">بازی</h2><div id="gameArea"></div></div></div>
<script src="app.js"></script>
</body></html>
